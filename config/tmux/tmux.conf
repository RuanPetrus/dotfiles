set -g mouse on
set -g set-clipboard on
set -g mode-keys vi

# Let mouse-aware apps handle scrolling; otherwise use tmux history.
bind-key -T root WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
  'send-keys -M' \
  'copy-mode -e; send-keys -X -N 5 scroll-up'
bind-key -T root WheelDownPane if-shell -F '#{pane_in_mode}' \
  'send-keys -X -N 5 scroll-down' \
  'send-keys -M'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
